services:
  postgres:
    image: postgres:16-alpine
    container_name: processes-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: processes_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: processes-test-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"

  mysql:
    image: mysql:8.0
    container_name: processes-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Password123!"
      MYSQL_DATABASE: processes_test
    ports:
      - "3306:3306"

  mariadb:
    image: mariadb:11
    container_name: processes-test-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: "Password123!"
      MARIADB_DATABASE: processes_test
    ports:
      - "3307:3306"

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: processes-test-oracle
    environment:
      ORACLE_PASSWORD: "Password123!"
    ports:
      - "1521:1521"
